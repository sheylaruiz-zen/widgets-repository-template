<style>
  .academy-spotlight {
    --as-canvas: var(--config--main-color-background, #f5f5f5);
    --as-canvas-end: var(--config--main-color-background, #ffffff);
    --as-border: var(--config--main-color-border, #e0e0e0);
    --as-accent: var(--config--main-color-brand, #0f3733);
    --as-badge-bg: var(--config--main-color-brand, #0f3733);
    --as-badge-text: var(--config--main-color-background, #ffffff);
    --as-text: var(--config--main-color-text, #2c2c2b);
    --as-muted: var(--config--main-color-text-secondary, #5c5a56);
    --as-cta: var(--config--main-color-brand, #0f3733);
    --as-cta-hover: var(--config--main-color-brand-hover, #1c524c);
    --as-shadow: rgba(0, 0, 0, 0.16) 0 2px 4px;
    --as-shadow-hover: rgba(0, 0, 0, 0.3) 0 2px 4px;
    --as-inset: 25px;

    position: relative;
    box-sizing: border-box;
    width: auto;
    margin: 0 var(--as-inset);
    background: linear-gradient(135deg, var(--as-canvas) 0%, var(--as-canvas-end) 100%);
    border: 1px solid var(--as-border);
    border-radius: 6px;
    box-shadow: var(--as-shadow);
    overflow: hidden;
    font-family: var(--config--main-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
    color: var(--as-text);
    transition: box-shadow 200ms ease-in-out;
  }

  .academy-spotlight:hover,
  .academy-spotlight:focus-within,
  .academy-spotlight:active {
    box-shadow: var(--as-shadow-hover);
  }

  .academy-spotlight::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--as-accent);
  }

  .academy-spotlight *,
  .academy-spotlight *::before,
  .academy-spotlight *::after {
    box-sizing: border-box;
  }

  .academy-spotlight__media {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--as-border);
    overflow: hidden;
  }

  .academy-spotlight__media[hidden] {
    display: none;
  }

  .academy-spotlight__image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .academy-spotlight__body {
    padding: 20px;
  }

  .academy-spotlight__label {
    display: inline-block;
    margin: 0 0 14px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--as-badge-bg);
    color: var(--as-badge-text);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .academy-spotlight__label[hidden] {
    display: none;
  }

  .academy-spotlight__title {
    margin: 0 0 8px;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.3;
  }

  .academy-spotlight__blurb {
    margin: 0 0 12px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--as-muted);
  }

  .academy-spotlight__blurb[hidden] {
    display: none;
  }

  .academy-spotlight__cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    background: none;
    border: none;
    color: var(--as-cta);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    text-decoration: none;
    transition: color 120ms ease-in-out;
  }

  .academy-spotlight__cta:hover,
  .academy-spotlight__cta:focus-visible {
    color: var(--as-cta-hover);
    text-decoration: underline;
  }

  .academy-spotlight__cta:focus-visible {
    outline: 2px solid var(--as-cta);
    outline-offset: 3px;
  }

  .academy-spotlight__cta[hidden] {
    display: none;
  }

  .academy-spotlight__arrow {
    flex: 0 0 auto;
    transition: transform 120ms ease-in-out;
  }

  .academy-spotlight__cta:hover .academy-spotlight__arrow,
  .academy-spotlight__cta:focus-visible .academy-spotlight__arrow {
    transform: translateX(2px);
  }

  @media (max-width: 480px) {
    .academy-spotlight {
      --as-inset: 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .academy-spotlight,
    .academy-spotlight__cta,
    .academy-spotlight__arrow {
      transition: none;
    }
  }

  @media (prefers-color-scheme: dark) {
    .academy-spotlight {
      --as-canvas: var(--config--main-color-background, #202020);
      --as-canvas-end: var(--config--main-color-background, #2a2a2a);
      --as-border: var(--config--main-color-border, rgba(255, 255, 255, 0.16));
      --as-accent: var(--config--main-color-brand, #4fd1c5);
      --as-badge-bg: var(--config--main-color-brand, #4fd1c5);
      --as-badge-text: var(--config--main-color-background, #0f3733);
      --as-text: var(--config--main-color-text, #ffffff);
      --as-muted: var(--config--main-color-text-secondary, rgba(255, 255, 255, 0.65));
      --as-cta: var(--config--main-color-brand, #4fd1c5);
      --as-cta-hover: var(--config--main-color-brand-hover, #7fe0d6);
      --as-shadow: rgba(0, 0, 0, 0.4) 0 2px 4px;
      --as-shadow-hover: rgba(0, 0, 0, 0.6) 0 2px 4px;
    }
  }
</style>

<section class="academy-spotlight" aria-labelledby="academy-spotlight-title">
  <div class="academy-spotlight__media" data-as="media" hidden>
    <img class="academy-spotlight__image" data-as="image" src="" alt="" />
  </div>
  <div class="academy-spotlight__body">
    <p class="academy-spotlight__label" data-as="label" hidden></p>
    <h3 class="academy-spotlight__title" id="academy-spotlight-title" data-as="title"></h3>
    <p class="academy-spotlight__blurb" data-as="blurb" hidden></p>
    <a class="academy-spotlight__cta" data-as="cta" href="#" hidden>
      <span data-as="cta-label"></span>
      <svg class="academy-spotlight__arrow" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" focusable="false">
        <path d="M3 7h8M7.5 3.5 11 7l-3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </div>
</section>

<script type="module" src="./widget.js"></script>
